# ============================================================================
# Audio CLI Configuration
# ============================================================================
# This file contains all configurable options for the audio processing CLI.
# All values shown are the defaults. Uncomment and modify as needed.
#
# Usage:
#   semantics-audio -i input.mp4 -o ./output --config config.yml [flags]
# ============================================================================

# ----------------------------------------------------------------------------
# Resample Configuration
# ----------------------------------------------------------------------------
# Controls audio format conversion and resampling to the target format.
resample:
  # Target sample rate in Hz (16000 is optimal for speech models)
  sample_rate: 16000
  # Number of output channels (1 = mono, required by most speech models)
  channels: 1

# ----------------------------------------------------------------------------
# Enhance Configuration
# ----------------------------------------------------------------------------
# Optional audio enhancement pass after resampling.
enhance:
  # Whether to run the enhancement pass
  enabled: false

# ----------------------------------------------------------------------------
# Stem Separation Configuration
# ----------------------------------------------------------------------------
# Source separation using Demucs to extract vocals from background audio.
# Useful for isolating speech from music, noise, or other audio sources.
stem:
  # Demucs model variant (htdemucs_ft is the fine-tuned version)
  model: htdemucs_ft
  # Chunk duration in seconds for processing long audio files
  chunk_length: 900
  # Which stem to extract (vocals, drums, bass, other)
  two_stems: vocals
  # Random shifts for equivariant stabilization (0=disabled, 1=Demucs default)
  # Higher values improve quality but multiply processing time proportionally
  shifts: 0
  # Overlap between processing segments (Demucs default 0.25)
  # 0.1 is faster with minimal quality impact per official docs
  overlap: 0.1

# ----------------------------------------------------------------------------
# Denoise Configuration
# ----------------------------------------------------------------------------
# Audio denoising to reduce background noise and improve speech clarity.
denoise:
  # Chunk duration in seconds for processing long audio files
  chunk_length: 900
  # Allow automatic amplitude scaling to normalize audio levels
  allow_auto_scale: true

# ----------------------------------------------------------------------------
# VAD (Voice Activity Detection) Configuration
# ----------------------------------------------------------------------------
# Detects speech segments in audio to identify when someone is speaking.
vad:
  # Chunk duration in seconds for processing long audio files
  chunk_length: 900
  # Speech probability threshold (0.0-1.0). Higher = stricter detection
  threshold: 0.5
  # Minimum speech segment duration in milliseconds
  min_speech_duration_ms: 250
  # Minimum silence duration to split segments in milliseconds
  min_silence_duration_ms: 100

# ----------------------------------------------------------------------------
# Transcribe Configuration
# ----------------------------------------------------------------------------
# Speech-to-text transcription using Whisper models.
transcribe:
  # Whisper model variant to use. Options include:
  #   tiny.en, tiny, base.en, base, small.en, small, medium.en, medium,
  #   large-v1, large-v2, large-v3, large, distil-large-v2, distil-medium.en,
  #   distil-small.en, distil-large-v3, distil-large-v3.5, large-v3-turbo, turbo
  model: distil-large-v3.5
  # Chunk duration in seconds for processing long audio files
  chunk_length: 900
  # Overlap between chunks in seconds to avoid boundary artifacts
  chunk_overlap_seconds: 5.0
  # Tolerance in seconds for merging adjacent segment boundaries
  segment_epsilon_seconds: 0.3
  # Device/precision fallback sequence: tries each in order until one works
  # Format: [[device, compute_type], ...]
  model_attempts:
    - [cuda, float16]
    - [cuda, int8_float16]
    - [cpu, int8]

# ----------------------------------------------------------------------------
# Diarize Configuration
# ----------------------------------------------------------------------------
# Speaker diarization using NeMo MSDD to identify who spoke when.
diarize:
  # Domain hint for optimization: "telephonic" or "meeting"
  domain_type: telephonic
  # NeMo VAD model name for voice activity detection
  pretrained_vad: vad_multilingual_marblenet
  # NeMo speaker embedding model for voice identification
  pretrained_speaker_model: titanet_large
  # NeMo MSDD model for multi-scale diarization
  msdd_model: diar_msdd_telephonic
  # VAD onset threshold (speaker starts speaking)
  onset: 0.8
  # VAD offset threshold (speaker stops speaking)
  offset: 0.6
  # Padding around speech segments in seconds (negative trims)
  pad_offset: -0.05

  # Long audio mode settings (activated when audio exceeds threshold)
  # Duration in seconds to activate long-audio optimizations
  long_audio_threshold_secs: 1800.0
  # Multiscale window lengths for embedding extraction
  long_audio_window_length_in_sec: [1.5, 1.0]
  # Multiscale shift lengths (hop sizes)
  long_audio_shift_length_in_sec: [0.75, 0.5]
  # Weights for combining multiscale results
  long_audio_multiscale_weights: [1.0, 1.0]
  # Max embeddings per chunk to prevent memory issues
  long_audio_embeddings_per_chunk_max: 600
  # Max clusters per chunk in hierarchical clustering
  long_audio_chunk_cluster_count_max: 24
  # Max speakers to consider during MSDD refinement
  long_audio_max_num_speakers_max: 6
  # Sparse search volume for speaker matching
  long_audio_sparse_search_volume_max: 10
  # Max RP threshold for clustering decisions
  long_audio_max_rp_threshold_max: 0.2

# ----------------------------------------------------------------------------
# CTC Alignment Configuration
# ----------------------------------------------------------------------------
# Forced alignment using CTC models to get precise word-level timestamps.
ctc:
  # Margin in seconds added around aligned segments
  segment_margin_seconds: 0.75
  # Fallback margin sequence when alignment fails
  segment_margin_backoffs: [0.0, 2.0, 5.0, 10.0]
  # Minimum overlap required to assign a speaker to a segment
  min_speaker_overlap_seconds: 0.0

# ----------------------------------------------------------------------------
# Classify Configuration
# ----------------------------------------------------------------------------
# Audio classification using the AST (Audio Spectrogram Transformer) model.
classify:
  # HuggingFace model ID for audio classification
  model_id: MIT/ast-finetuned-audioset-10-10-0.4593
  # Expected input sample rate in Hz
  expected_sample_rate: 16000
  # Chunk duration in seconds for processing long audio files
  chunk_length: 900
  # Number of top predicted classes to return
  top_n: 5

# ----------------------------------------------------------------------------
# Timeline Classifier Configuration
# ----------------------------------------------------------------------------
# Sliding window audio classification for emotion and audio event timelines.
classify_timeline:
  # Device override: "cuda", "cpu", or null for auto-detection
  device: null
  # Batch size for inference (higher = faster but more memory)
  batch_size: 8
  # Analysis window size in seconds
  window_size: 2.0
  # Hop between windows in seconds (overlap = window_size - hop_size)
  hop_size: 1.0
  # Target sample rate for analysis
  target_sample_rate: 16000
  # Minimum confidence threshold for emotion labels
  emotion_threshold: 0.12
  # Minimum confidence threshold for audio event labels
  audio_event_threshold: 0.35
  # Minimum segment duration in seconds (shorter segments are merged)
  min_segment_duration: 0.5
  # Softmax temperature for emotion model (lower = sharper distributions)
  emotion_temperature: 0.7
  # Window size for probability smoothing (odd number, 1 = no smoothing)
  emotion_prob_smoothing: 5
  # Gamma for confidence shaping (>1 amplifies confident predictions)
  emotion_confidence_gamma: 1.35
  # Minimum VAD overlap ratio to consider segment as speech
  min_speech_overlap_ratio: 0.15
  # VAD probability threshold for speech detection
  vad_threshold: 0.5
  # VAD minimum speech duration in milliseconds
  vad_min_speech_duration_ms: 250
  # VAD minimum silence duration in milliseconds
  vad_min_silence_duration_ms: 100
  # Energy analysis window size in seconds
  energy_window: 1.0

# ----------------------------------------------------------------------------
# Emotion Recognition Configuration
# ----------------------------------------------------------------------------
# Speech emotion recognition for transcript segments.
emotion:
  # HuggingFace model ID for emotion recognition
  model_name: ehcalabres/wav2vec2-lg-xlsr-en-speech-emotion-recognition
  # Device override: "cuda", "cpu", or null for auto-detection
  device: null
  # Batch size for inference
  batch_size: 8
  # Softmax temperature for predictions
  temperature: 0.7
  # Window size for probability smoothing
  prob_smoothing: 5
  # Gamma for confidence shaping
  confidence_gamma: 1.35
  # Minimum confidence threshold for predictions
  threshold: 0.12
  # Target sample rate for analysis
  target_sample_rate: 16000
  # Minimum segment duration in seconds (shorter segments are skipped)
  min_duration: 0.35
  # Padding around segments in seconds for context
  pad_seconds: 0.15
  # Prefer CTC alignment segments over raw transcript segments
  use_forced_alignment: true

# ----------------------------------------------------------------------------
# Named Entity Recognition Configuration
# ----------------------------------------------------------------------------
# Extract named entities (persons, organizations, locations, etc.) from
# transcription segments.
ner:
  # HuggingFace model ID for NER
  model_name: Jean-Baptiste/roberta-large-ner-english
  # Device override: "cuda", "cpu", or null for auto-detection
  device: null
  # Batch size for inference (higher = faster but more memory)
  batch_size: 8
  # Minimum confidence threshold for entity detection (0.0-1.0)
  confidence_threshold: 0.92
  # Token aggregation strategy: simple, first, average, max
  aggregate_strategy: simple

# ----------------------------------------------------------------------------
# Scenes / Chapters Configuration
# ----------------------------------------------------------------------------
# Chapter detection using embeddings and optional LLM for title generation.
scenes:
  # Sentence embedding model for semantic boundary detection
  embed_model: all-MiniLM-L6-v2
  # LLM for generating chapter overviews and summaries
  llm_model: microsoft/phi-4-mini-instruct
  # Lightweight LLM for generating chapter titles (smaller, faster model)
  title_model: microsoft/phi-4-mini-instruct
  # Minimum chapter length in seconds (prevents over-segmentation)
  min_chapter_length: 120.0
  # Percentile threshold for boundary detection (higher = fewer chapters)
  boundary_percentile: 75.0
  # Maximum new tokens for LLM title/summary generation
  max_new_tokens: 256
  # Maximum context characters for LLM prompts
  max_ctx_chars: 6000
  # Chunk size in characters for global summary
  global_chunk_chars: 4000
  # Context snippet size in characters for boundary prompts
  context_snippet_chars: 1200
  # Token limit for global chunk summaries
  global_chunk_tokens: 160
  # Token limit for final global summary
  global_summary_tokens: 220
  # LLM temperature for generation (higher = more creative)
  temperature: 0.7
  # LLM top-p for nucleus sampling
  top_p: 0.9
  # Enable LLM for title/summary (false = embedding-based boundaries only)
  enable_llm: true
