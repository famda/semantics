# =============================================================================
# Video Processing CLI Configuration
# =============================================================================
# This file contains all configurable options for the video processing pipeline.
# Uncomment and modify values as needed. Defaults are shown in comments.

# -----------------------------------------------------------------------------
# Download Configuration (YouTube/URL downloads)
# -----------------------------------------------------------------------------
download:
  # Maximum video height when downloading from URLs.
  # Quality labels:
  #   Full HD (1080p) = 1920x1080
  #   HD     ( 720p) = 1280x720
  #   SD     ( 480p) =  854x480
  #   SD     ( 360p) =  640x360   <- default
  #   SD     ( 240p) =  426x240
  max_height: 360

  # yt-dlp filename template for downloaded videos
  # See: https://github.com/yt-dlp/yt-dlp#output-template
  filename_template: "%(title)s_%(id)s.%(ext)s"

# -----------------------------------------------------------------------------
# Slice Configuration
# -----------------------------------------------------------------------------
# Time-range extraction settings.
# Timestamps are provided via --slice-start / --slice-end CLI flags.
slice:
  # FFmpeg codec: 'copy' for stream-copy (fastest) or a specific codec name
  codec: copy
  # Re-encode automatically when stream-copy fails
  fallback_reencode: true

# -----------------------------------------------------------------------------
# Frame Extraction Configuration
# -----------------------------------------------------------------------------
frames:
  # Target frames per second for extraction
  # null uses the source video's native FPS
  target_fps: null

  # Enable hardware acceleration (CUDA, NVDEC, VAAPI, etc.) for decoding
  # Significantly speeds up frame extraction on supported systems
  enable_hwaccel: true

  # Number of parallel FFmpeg jobs for frame extraction
  # null auto-detects based on CPU cores
  parallel_jobs: null

# -----------------------------------------------------------------------------
# Segment/Keyframe Extraction Configuration (PySceneDetect adaptive)
# -----------------------------------------------------------------------------
segments:
  # FPS used for scene detection (downsampled from source)
  # Lower values = faster detection but may miss quick cuts
  target_detection_fps: 12.0

  # Always include the last frame of the video as a keyframe
  include_last_frame: true

# -----------------------------------------------------------------------------
# Frame Clustering Configuration (MobileNet-based)
# -----------------------------------------------------------------------------
clustering:
  # MobileNet cosine similarity threshold for cluster merging
  # Higher = more strict clustering, fewer merged frames
  mn_threshold: 0.995

  # DBSCAN epsilon for MobileNet feature clustering
  mn_eps: 0.2

  # DBSCAN min_samples for MobileNet clustering
  mn_min_samples: 3

  # Frame sampling rate for clustering analysis (FPS)
  fps: 1.0

  # Enable keyframe selection from clusters
  keyframes: true

  # DBSCAN epsilon for keyframe sub-clustering
  kf_eps: 0.18

  # DBSCAN min_samples for keyframe sub-clustering
  kf_min_samples: 1

  # Fraction of Hamming distance for perceptual hash filtering
  # Lower = more strict filtering
  kf_hamming_frac: 0.30

  # Require both DBSCAN and Hamming criteria for keyframe selection
  kf_require_both: true

  # Save selected keyframes to disk as images
  save_keyframes: true

  # Save all cluster frames to disk (can generate many files)
  save_clusters: false

# -----------------------------------------------------------------------------
# Captions Configuration (Florence-2)
# -----------------------------------------------------------------------------
captions:
  # HuggingFace model ID for Florence-2 captioning
  # Options: "microsoft/Florence-2-base", "microsoft/Florence-2-large-ft"
  model_id: "microsoft/Florence-2-large-ft"

  # Model precision for inference
  # Options: "fp16", "fp32", "bf16"
  precision: "fp16"

  # Default object queries for visual grounding (dot-separated list)
  default_queries: "person. car. dog. cat. bicycle. chair. book. phone. text."

  # Enable OCR text extraction from frames
  run_ocr: false

  # Enable object detection in frames
  run_objects: false

  # Enable visual grounding for object queries
  run_visual_grounding: false

# -----------------------------------------------------------------------------
# Object Detection Configuration (YOLO + DeepFace)
# -----------------------------------------------------------------------------
objects:
  # YOLO model for object detection
  # Options: "yolo11n.pt", "yolo11s.pt", "yolo11m.pt", "yolo11l.pt", "yolo11x.pt"
  #          "yolo26n.pt", "yolo26s.pt", "yolo26m.pt", "yolo26l.pt", "yolo26x.pt"
  detection_model: "yolo26s.pt"

  # YOLO model for instance segmentation
  # Options: "yolo11n-seg.pt", "yolo11s-seg.pt", "yolo11m-seg.pt", etc.
  #          "yolo26n-seg.pt", "yolo26s-seg.pt", "yolo26m-seg.pt", etc.
  segmentation_model: "yolo26s-seg.pt"

  # YOLO model for pose estimation
  # Options: "yolo11n-pose.pt", "yolo11s-pose.pt", "yolo11m-pose.pt", etc.
  #          "yolo26n-pose.pt", "yolo26s-pose.pt", "yolo26m-pose.pt", etc.
  pose_model: "yolo26s-pose.pt"

  # Confidence threshold for YOLO object detection (0.0 - 1.0)
  object_conf_threshold: 0.80

  # IoU threshold for matching detections across frames
  iou_match_threshold: 0.5

  # Confidence threshold for pose keypoint detection
  keypoint_conf_threshold: 0.6

  # Confidence threshold for face detection
  face_conf_threshold: 0.9

  # DeepFace embedding model for face recognition
  # Options: "Facenet", "Facenet512", "VGG-Face", "ArcFace", etc.
  embedding_model_name: "Facenet512"

  # Minimum image side length for face detection upscaling
  face_detect_min_side: 720

  # Maximum scale factor for face detection upscaling
  face_detect_max_scale: 2.0

  # DeepFace detector backend
  # Options: "retinaface", "mtcnn", "opencv", "ssd", "dlib"
  detector_backend: "retinaface"

  # HuggingFace CLIP model for object embedding and similarity
  # Options: "openai/clip-vit-base-patch32", "openai/clip-vit-base-patch16", "openai/clip-vit-large-patch14", etc.
  clip_model_name: "openai/clip-vit-base-patch32"

  # Base DBSCAN epsilon for object clustering
  cluster_base_eps: 0.35

  # Base DBSCAN epsilon for face clustering
  face_cluster_base_eps: 0.20

  # Cosine similarity threshold for near-duplicate pre-filtering before clustering.
  # Crops above this similarity to the previous kept crop are collapsed.
  cluster_dedup_threshold: 0.95

  # Maximum cosine distance from nearest centroid before a crop goes to noise folder.
  cluster_noise_max_distance: 0.60

  # DBSCAN min_samples for object clustering
  cluster_min_samples: 1

  # Minimum clustering attempts for adaptive epsilon tuning
  cluster_min_attempts: 4

  # DBSCAN epsilon for keyframe extraction from object clusters
  keyframe_eps: 0.12

  # DBSCAN min_samples for keyframe extraction
  keyframe_min_samples: 1

  # Hamming distance fraction for perceptual hash keyframe filtering
  keyframe_hamming_frac: 0.30

  # Require both DBSCAN and Hamming criteria for keyframe selection
  keyframe_require_both: true

# -----------------------------------------------------------------------------
# Tiles Configuration (Video Mosaics)
# -----------------------------------------------------------------------------
tiles:
  # Number of columns in the tile grid
  columns: 3

  # Number of rows in the tile grid
  rows: 3

  # Final tile width in pixels (null preserves original dimensions)
  final_tile_width: null

  # Final tile height in pixels (null preserves original dimensions)
  final_tile_height: null

  # RGB background color for empty tile spaces [R, G, B]
  background_color: [0, 255, 0]

# -----------------------------------------------------------------------------
# Scene Detection Configuration (PySceneDetect)
# -----------------------------------------------------------------------------
scenes:
  # Scene detector type
  # Options: "content" (color histogram), "threshold" (brightness)
  detector_type: "content"

  # Detection threshold for scene changes
  # Higher = fewer scene cuts detected
  threshold: 27.0

  # Minimum scene length in frames
  # Prevents very short scenes from being split
  min_scene_len: 15

  # Use codec copy for faster scene splitting
  # May cause issues at scene boundaries (artifacts, sync problems)
  use_codec_copy: false

# -----------------------------------------------------------------------------
# Action Recognition Configuration
# -----------------------------------------------------------------------------
actions:
  # HuggingFace model for action recognition
  # Recommended: "MCG-NJU/videomae-large-finetuned-kinetics" (most accurate, 16 frames)
  # Alternative: "MCG-NJU/videomae-base-finetuned-kinetics" (faster)
  # Alternative: "facebook/timesformer-base-finetuned-k400" (fastest, 8 frames)
  model: "MCG-NJU/videomae-base-finetuned-kinetics"

  # Number of frames to sample per clip (must match model requirements)
  # VideoMAE: 16 frames, TimeSformer: 8 frames
  num_frames: 16

  # Frame sample rate - sample every n-th frame
  # Temporal span = num_frames * frame_sample_rate frames
  # Example: 16 frames * 4 = 64 frame span (~2.1s at 30fps)
  # Higher values = longer clips that capture full actions
  frame_sample_rate: 4

  # Minimum confidence threshold for action predictions (0.0 - 1.0)
  # Lower values capture more actions but may include false positives
  conf_threshold: 0.40

  # Number of top action predictions to return per clip
  top_k: 3

  # Batch size for processing video clips (reduce for OOM errors)
  # Higher values are faster with more GPU parallelism (8 for RTX 6GB+)
  batch_size: 8

  # Save video clips for each detected action to actions/clips/ folder
  save_clips: true

  # === Clip Coverage Settings ===
  # Controls how clips are placed within activity segments for analysis

  # Overlap ratio (0.0-1.0) between consecutive clips in activity segments
  # 0.75 = 75% overlap for thorough coverage, 0.0 = no overlap
  clip_overlap: 0.75

  # Seconds of padding for temporal context
  # Applied to: 1) activity segments during analysis, 2) saved action clips
  # Helps capture the start/end of actions and adds context to exported clips
  padding: 1.0

  # === Activity Pre-Scan Settings ===
  # The module uses a fast motion-based pre-scan to identify active regions
  # before running the expensive action recognition model.

  # Frames per second to analyze during activity scan
  # Higher = more accurate motion detection but slower
  scan_fps: 2.0

  # Minimum motion ratio (0.0-1.0) to consider a frame as active
  # 0.02 = 2% of pixels changed between frames
  motion_threshold: 0.02

  # Minimum duration in seconds for an activity segment to be analyzed
  min_activity_duration: 0.5

  # Maximum gap in seconds between activity segments to merge them
  merge_gap: 1.0

# -----------------------------------------------------------------------------
# Image Classification Configuration (YOLO Classification)
# -----------------------------------------------------------------------------
classification:
  # YOLO classification model
  # Options: "yolo11n-cls.pt", "yolo11s-cls.pt", "yolo11m-cls.pt", "yolo11l-cls.pt", "yolo11x-cls.pt"
  model: "yolo11s-cls.pt"

  # Minimum confidence threshold for predictions (0.0 - 1.0)
  # Lower values return more predictions, higher values are more selective
  conf_threshold: 0.25

  # Number of top predictions to return per frame
  top_k: 5

# -----------------------------------------------------------------------------
# Named Entity Recognition Configuration
# -----------------------------------------------------------------------------
# Extract named entities (persons, organizations, locations, etc.) from
# video captions.
ner:
  # HuggingFace model ID for NER
  model_name: Jean-Baptiste/roberta-large-ner-english
  # Device override: "cuda", "cpu", or null for auto-detection
  device: null
  # Batch size for inference (higher = faster but more memory)
  batch_size: 8
  # Minimum confidence threshold for entity detection (0.0-1.0)
  confidence_threshold: 0.92
  # Token aggregation strategy: simple, first, average, max
  aggregate_strategy: simple
  # Caption field to use for NER: caption, caption_detailed, caption_more_detailed
  caption_field: caption_more_detailed
