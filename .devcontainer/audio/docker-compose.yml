# Standalone devcontainer compose for worker-audio
# Uses the production Dockerfile but only builds this single service

x-cuda-support: &cuda-support
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu, utility, compute, video]

services:
  worker-audio:
    build:
      context: ../..
      dockerfile: src/Dockerfile
      args:
        WORKER_TYPES: "audio"
    tty: true
    stdin_open: true
    environment:
      - TF_ENABLE_ONEDNN_OPTS=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ../../.data/platform/workspaces:/workspaces
      - ../../src/semantics/audio/modules:/platform/audio/modules:cached
      - ../../src/semantics/audio/main.py:/platform/audio/main.py:cached
      - ../../src/semantics/audio/config.py:/platform/audio/config.py:cached
      - ../../src/semantics/audio/constants.py:/platform/audio/constants.py:cached
      - ../../src/semantics/global_helpers.py:/platform/audio/global_helpers.py:cached
    <<: *cuda-support
