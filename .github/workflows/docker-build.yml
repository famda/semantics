name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/semantics

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: audio
            worker_types: audio
          - worker: video
            worker_types: video
          - worker: research
            worker_types: research
          - worker: docs
            worker_types: docs
          - worker: cli
            worker_types: "audio,video,research,docs"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # latest tag for main branch
            type=raw,value=${{ matrix.worker }}-latest,enable={{is_default_branch}}
            # sha tag for traceability
            type=sha,prefix=${{ matrix.worker }}-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WORKER_TYPES=${{ matrix.worker_types }}
          cache-from: type=gha,scope=${{ matrix.worker }}
          cache-to: type=gha,mode=max,scope=${{ matrix.worker }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Docker Images

            This release includes the following Docker images:

            - `famda/semantics:audio-latest`
            - `famda/semantics:video-latest`
            - `famda/semantics:research-latest`
            - `famda/semantics:docs-latest`
            - `famda/semantics:cli-latest`

            Pull with:
            ```bash
            docker pull famda/semantics:audio-latest
            docker pull famda/semantics:video-latest
            docker pull famda/semantics:research-latest
            docker pull famda/semantics:docs-latest
            docker pull famda/semantics:cli-latest
            ```
