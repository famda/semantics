[project]
name = "audio"
version = "0.1.0"
description = "Audio CLI for speech transcription, speaker diarization, and audio processing"
requires-python = ">=3.11,<3.14"
dependencies = [
    "click>=8.2.1",
    "colorama>=0.4.6",
    "numpy<3.0.0",
    "rich>=14.0.0",
    "rich-click>=1.9.0",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
full = [
    "accelerate>=1.0.0",
    "audio-denoiser>=0.1.2",
    "ctc-segmentation>=1.7.4; platform_system != 'Windows'",
    "cython>=3.2.4",
    "demucs>=4.0.1",
    "diffusers>=0.36.0",
    "fastdtw>=0.3.4",
    "faster-whisper>=1.2.1",
    "huggingface-hub[hf-xet]>=0.36.0",
    "librosa>=0.11.0",
    "nemo-toolkit[asr]>=2.3.0; platform_system != 'Windows'",
    "nltk>=3.9.2",
    "optimum>=1.0.0",
    "packaging>=24.2",
    "pydub>=0.25.1",
    "sentence-transformers>=5.2.0",
    "silero-vad>=6.2.0",
    "soundfile>=0.13.1",
    "torch<2.9",
    "torchaudio<2.9",
    "transformers>=4.57.0",
]
