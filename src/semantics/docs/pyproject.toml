[project]
name = "docs"
version = "0.1.0"
description = "Document CLI for structured extraction and document processing"
requires-python = ">=3.11,<3.14"
dependencies = [
    "click>=8.2.1",
    "colorama>=0.4.6",
    "rich>=14.0.0",
    "rich-click>=1.9.0",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    "unstructured[all-docs]>=0.18",
    "python-magic>=0.4.27",
    "pymupdf4llm>=0.0.20",
]
