requires-python = ">=3.11,<3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "click>=8.2.1",
    "colorama>=0.4.6",
    "crawl4ai>=0.7",
    "rich>=14.0.0",
    "rich-click>=1.9.0",
    "ddgs>=9.0",
    "einops>=0.8.1",
    "huggingface-hub[hf-xet]>=0.36.0",
    "litellm>=1.70",
    "lxml>=5.4.0",
    "nltk>=3.9.2",
    "numpy<3.0.0",
    "openai>=2.0",
    "playwright>=1.57.0",
    "pydantic>=2.0",
    "pypdf>=6.6.0",
    "python-magic>=0.4.27",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.3",
    "requests>=2.32.5",
    "sentence-transformers>=5.0",
    "torch<2.9",
