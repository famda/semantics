[project]
name = "video"
version = "0.1.0"
description = "Video CLI for scene detection, object recognition, and video processing"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.12.0",
    "click>=8.2.1",
    "clip",
    "colorama>=0.4.6",
    "rich>=14.0.0",
    "rich-click>=1.9.0",
    "deepface==0.0.93",
    "easyocr>=1.7.2",
    "einops>=0.8.1",
    "httpx<0.28",
    "numpy<3.0.0",
    "opencv-python>=4.13.0.90",
    "pandas>=2.3.3",
    "pillow>=12.1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.3",
    "requests>=2.32.5",
    "scenedetect[opencv]>=0.6.7",
    "scikit-learn>=1.8.0",
    "supervision>=0.27.0",
    "timm>=1.0.24",
    "torch<2.9",
    "torchaudio<2.9",
    "tqdm>=4.67.1",
    "transformers>=4.57.0",
    "ultralytics>=8.4.6",
    "youtube-search-python>=1.6.6",
    "yt-dlp>=2025.9.26",
]

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git" }
